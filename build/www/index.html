<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Heavy Weapon</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#game { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
  #err { position: absolute; left: 8px; top: 8px; right: 8px; color: #f88; font: 12px monospace; white-space: pre-wrap; z-index: 9; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="err"></div>
<script>
  window.onerror = function (msg, src, line, col, err) {
    var e = document.getElementById('err');
    if (e && e.childNodes.length < 8) e.appendChild(document.createTextNode((err && err.stack ? err.stack : msg + ' @' + src + ':' + line) + '\n'));
  };
</script>
<script src="js/game.js"></script>
</body>
</html>
